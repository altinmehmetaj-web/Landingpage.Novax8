<!DOCTYPE html>
<html lang="it">
<head>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2Q5GPP9R94"></script>

    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2Q5GPP9R94');

  <link rel="icon" type="image/png" href="assets/favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: #f4f4f0;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    .thank-you {
      width: 100%;
      max-width: 760px;
    }

    .logo {
      max-width: 430px;
      width: 90%;
      height: auto;
      margin-bottom: 45px;
    }

    .line {
      width: 90px;
      height: 2px;
      background: #7c4dff;
      margin: 0 auto 35px;
    }

    h1 {
      font-size: clamp(38px, 6vw, 64px);
      line-height: 1.05;
      margin-bottom: 25px;
    }

    p {
      font-size: 19px;
      line-height: 1.65;
      color: #d2d2d2;
      max-width: 650px;
      margin: 0 auto;
    }

    .highlight {
      color: #ffffff;
      font-weight: 700;
    }

    .button {
      display: inline-block;
      margin-top: 40px;
      padding: 16px 32px;
      background: #ffffff;
      color: #111111;
      text-decoration: none;
      font-weight: 700;
      border-radius: 8px;
      transition: transform .2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

<body>

  <main class="thank-you">

    <img
    src="assets/creator-generation-logo.png"

    <h1>Richiesta ricevuta.</h1>

    <p>
      Grazie per il tuo interesse in
      <span class="highlight">Creator Generation.</span><br><br>

      Abbiamo ricevuto correttamente i tuoi dati.
      Ti ricontatteremo a breve per organizzare
      un <span class="highlight">colloquio conoscitivo gratuito</span>
      e spiegarti meglio come funziona il progetto.
    </p>

    <a href="/" class="button">
      TORNA AL SITO
    </a>

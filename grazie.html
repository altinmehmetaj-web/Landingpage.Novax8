       GOOGLE ANALYTICS 4
       Caricato SOLO se l'utente ha dato consenso Analytics
  ========================================================== -->

  <script>
  (function () {

    const STORAGE_KEY = 'cg_cookie_preferences';

    function hasAnalyticsConsent() {

      try {

        const stored =
          localStorage.getItem(STORAGE_KEY);

        if (!stored) {
          return false;
        }

        const preferences =
          JSON.parse(stored);

        if (!preferences.timestamp) {
          return false;
        }

        /* Verifica validità consenso: massimo 6 mesi */

        const consentDate =
          new Date(preferences.timestamp);

        const expiryDate =
          new Date(consentDate);

        expiryDate.setMonth(
          expiryDate.getMonth() + 6
        );

        if (new Date() >= expiryDate) {

          localStorage.removeItem(STORAGE_KEY);

          return false;

        }

        return preferences.analytics === true;

      } catch (error) {

        return false;

      }

    }


    function loadGA4() {

      if (!hasAnalyticsConsent()) {
        return;
      }

      if (window.cgGA4Loaded) {
        return;
      }

      window.cgGA4Loaded = true;

      window.dataLayer =
        window.dataLayer || [];

      window.gtag =
        window.gtag || function () {
          window.dataLayer.push(arguments);
        };

      window.gtag('js', new Date());

      const googleScript =
        document.createElement('script');

      googleScript.async = true;

      googleScript.src =
        'https://www.googletagmanager.com/gtag/js?id=G-2Q5GPP9R94';

      document.head.appendChild(googleScript);

      window.gtag(
        'config',
        'G-2Q5GPP9R94',
        {
          'anonymize_ip': true
        }
      );

    }


    loadGA4();

  })();
  </script>
